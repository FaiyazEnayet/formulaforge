course: "MAT 203"
title: "Linear Algebra"
description: "Vectors, matrices, and linear maps: systems, determinants, eigenvalues, orthogonality, and least squares."

formulas:
  - id: matrix-add
    name: "Matrix addition and scalar multiplication"
    topic: "Matrices"
    latex: '(A + B)_{ij} = A_{ij} + B_{ij}, \quad (cA)_{ij} = c A_{ij}'
    description: "Entrywise operations. Same shape required for addition."
    tags: [definition]
    derives_from: []

  - id: matrix-mult
    name: "Matrix multiplication"
    topic: "Matrices"
    latex: '(AB)_{ij} = \sum_k A_{ik} B_{kj}'
    description: "Row i of A dot column j of B. Inner dimensions must match; AB != BA in general."
    tags: [definition]
    derives_from: []

  - id: transpose
    name: "Transpose"
    topic: "Matrices"
    latex: '(A^T)_{ij} = A_{ji}'
    description: "Flip across the main diagonal. Symmetric means A^T = A."
    tags: [definition]
    derives_from: []

  - id: transpose-props
    name: "Transpose properties"
    topic: "Matrices"
    latex: '(AB)^T = B^T A^T, \quad (A^T)^T = A'
    description: "Order reverses under transpose, like socks and shoes."
    tags: [property]
    derives_from: [matrix-mult, transpose]

  - id: identity
    name: "Identity matrix"
    topic: "Matrices"
    latex: 'AI = IA = A'
    description: "Ones on the diagonal, zeros elsewhere. The multiplicative unit."
    tags: [definition]
    derives_from: [matrix-mult]

  - id: det-2x2
    name: "Determinant (2x2)"
    topic: "Determinants"
    latex: '\det \begin{pmatrix} a & b \\ c & d \end{pmatrix} = ad - bc'
    description: "Signed area scaling factor of the transformation."
    tags: [determinant]
    derives_from: []

  - id: det-nxn
    name: "Determinant (nxn, cofactor expansion)"
    topic: "Determinants"
    latex: '\det(A) = \sum_j (-1)^{i+j} a_{ij} M_{ij}'
    description: "Expand along any row or column; M_ij is the minor. Pick the row with most zeros."
    tags: [determinant]
    derives_from: [det-2x2]

  - id: det-props
    name: "Determinant properties"
    topic: "Determinants"
    latex: '\det(AB) = \det(A)\det(B), \quad \det(A^T) = \det(A)'
    description: "Multiplicative over products; unchanged by transpose."
    tags: [determinant, property]
    derives_from: [det-nxn, matrix-mult]

  - id: inverse-def
    name: "Matrix inverse (definition)"
    topic: "Inverses"
    latex: 'AA^{-1} = A^{-1}A = I'
    description: "The matrix that undoes A. Not every matrix has one."
    tags: [definition]
    derives_from: [matrix-mult, identity]

  - id: inverse-2x2
    name: "Inverse (2x2)"
    topic: "Inverses"
    latex: '\begin{pmatrix} a & b \\ c & d \end{pmatrix}^{-1} = \frac{1}{ad-bc} \begin{pmatrix} d & -b \\ -c & a \end{pmatrix}'
    description: "Swap a and d, negate b and c, divide by the determinant."
    tags: [inverse]
    derives_from: [det-2x2, inverse-def]

  - id: inverse-exists
    name: "Invertibility criterion"
    topic: "Inverses"
    latex: 'A \text{ invertible } \iff \det(A) \ne 0'
    description: "Zero determinant means the transformation crushes volume to zero."
    tags: [theorem]
    derives_from: [det-nxn, inverse-def]

  - id: solve-axb
    name: "Solving Ax = b"
    topic: "Inverses"
    latex: '\mathbf{x} = A^{-1} \mathbf{b} \quad \text{(A invertible)}'
    description: "Theory in one line; in practice use row reduction."
    tags: [system]
    derives_from: [inverse-def]

  - id: rref
    name: "Row reduction (RREF)"
    topic: "Systems"
    latex: '\text{leading 1 in each pivot column, zeros elsewhere in pivot columns}'
    description: "The algorithm that solves every linear system. Read solutions straight off."
    tags: [method]
    derives_from: []

  - id: rank
    name: "Rank"
    topic: "Systems"
    latex: '\text{rank}(A) = \#\text{pivots} = \dim(\text{col space}) = \dim(\text{row space})'
    description: "Number of independent directions the matrix actually reaches."
    tags: [definition]
    derives_from: [rref]

  - id: lin-indep
    name: "Linear independence"
    topic: "Vector Spaces"
    latex: 'c_1 \mathbf{v}_1 + \cdots + c_k \mathbf{v}_k = \mathbf{0} \implies c_1 = \cdots = c_k = 0'
    description: "No vector is a combo of the others. The only trivial relation."
    tags: [definition]
    derives_from: []

  - id: span
    name: "Span"
    topic: "Vector Spaces"
    latex: '\text{span}\{\mathbf{v}_1, \dots, \mathbf{v}_k\} = \left\{ \sum c_i \mathbf{v}_i \right\}'
    description: "Everything reachable by combining the vectors."
    tags: [definition]
    derives_from: []

  - id: basis
    name: "Basis"
    topic: "Vector Spaces"
    latex: '\text{basis} = \text{independent} + \text{spanning}'
    description: "A minimal coordinate system for the space."
    tags: [definition]
    derives_from: [lin-indep, span]

  - id: basis-count
    name: "Dimension theorem"
    topic: "Vector Spaces"
    latex: '\text{every basis of } \mathbb{R}^n \text{ has exactly } n \text{ vectors}'
    description: "Dimension is well defined: all bases of a space have the same size."
    tags: [theorem]
    derives_from: [basis]

  - id: rank-nullity
    name: "Rank-nullity theorem"
    topic: "Vector Spaces"
    latex: '\text{rank}(A) + \text{nullity}(A) = n \quad \text{(A is } m \times n \text{)}'
    description: "Columns are either pivots or free variables; nothing else."
    tags: [theorem]
    derives_from: [rank, lin-indep]

  - id: eigen-def
    name: "Eigenvalue and eigenvector"
    topic: "Eigenvalues"
    latex: 'A \mathbf{v} = \lambda \mathbf{v}, \quad \mathbf{v} \ne \mathbf{0}'
    description: "Directions the matrix only stretches. The heart of the course's second half."
    tags: [definition]
    derives_from: [matrix-mult]

  - id: char-poly
    name: "Characteristic polynomial"
    topic: "Eigenvalues"
    latex: '\det(A - \lambda I) = 0'
    description: "Its roots are the eigenvalues. Degree n for an n x n matrix."
    tags: [eigenvalue]
    derives_from: [eigen-def, det-nxn]

  - id: eigenspace
    name: "Eigenspace"
    topic: "Eigenvalues"
    latex: 'E_\lambda = \text{null}(A - \lambda I)'
    description: "All eigenvectors for one eigenvalue, plus zero. Find via row reduction."
    tags: [eigenvalue]
    derives_from: [eigen-def, rref]

  - id: diagonalization
    name: "Diagonalization"
    topic: "Eigenvalues"
    latex: 'A = PDP^{-1} \iff A \text{ has } n \text{ independent eigenvectors}'
    description: "Powers become trivial: A^k = PD^kP^{-1}. The payoff of eigenvalues."
    tags: [theorem]
    derives_from: [eigen-def, inverse-def]

  - id: dot
    name: "Dot product"
    topic: "Orthogonality"
    latex: '\mathbf{u} \cdot \mathbf{v} = \sum_i u_i v_i'
    description: "Algebraic angle measure. Zero means perpendicular."
    tags: [definition]
    derives_from: []

  - id: norm
    name: "Vector norm"
    topic: "Orthogonality"
    latex: '\lVert \mathbf{v} \rVert = \sqrt{\mathbf{v} \cdot \mathbf{v}}'
    description: "Length from the dot product. Unit vector: v / ||v||."
    tags: [definition]
    derives_from: [dot]

  - id: orthogonal
    name: "Orthogonality"
    topic: "Orthogonality"
    latex: '\mathbf{u} \cdot \mathbf{v} = 0 \iff \mathbf{u} \perp \mathbf{v}'
    description: "Perpendicular vectors. Orthogonal sets are automatically independent."
    tags: [definition]
    derives_from: [dot, lin-indep]

  - id: projection
    name: "Orthogonal projection"
    topic: "Orthogonality"
    latex: '\text{proj}_{\mathbf{u}}(\mathbf{v}) = \frac{\mathbf{v} \cdot \mathbf{u}}{\mathbf{u} \cdot \mathbf{u}} \, \mathbf{u}'
    description: "Shadow of v on u. The closest point on the line to v."
    tags: [projection]
    derives_from: [dot, norm]

  - id: gram-schmidt
    name: "Gram-Schmidt process"
    topic: "Orthogonality"
    latex: '\mathbf{w}_k = \mathbf{v}_k - \sum_{j<k} \text{proj}_{\mathbf{w}_j}(\mathbf{v}_k)'
    description: "Subtract all previous projections; what remains is orthogonal. Then normalize."
    tags: [method]
    derives_from: [projection, lin-indep]

  - id: least-squares
    name: "Least squares (normal equations)"
    topic: "Orthogonality"
    latex: 'A^T A \hat{\mathbf{x}} = A^T \mathbf{b}'
    description: "Best approximate solution: project b onto the column space."
    tags: [application]
    derives_from: [projection, transpose-props]

  - id: symmetric-eigen
    name: "Spectral theorem (symmetric matrices)"
    topic: "Eigenvalues"
    latex: 'A^T = A \implies \text{orthogonally diagonalizable, real eigenvalues}'
    description: "Symmetric matrices are the well-behaved ones: real spectrum, orthogonal eigenvectors."
    tags: [theorem]
    derives_from: [diagonalization, transpose]
