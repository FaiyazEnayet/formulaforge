    source: "OpenStax University Physics Volume 2, Section 4.4 (The Carnot Cycle)"
    conditions: "the engine exchanges heat with two reservoirs at absolute temperatures T_H and T_C in kelvin; the bound is attained only by a reversible (Carnot) cycle"
