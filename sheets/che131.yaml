course: "CHE 131"
title: "General Chemistry I"
description: "Moles, stoichiometry, gases, thermochemistry, and atomic structure: the quantitative core of first-semester chemistry."

formulas:
  - id: molar-mass
    name: "Molar mass"
    topic: "Stoichiometry"
    latex: 'M = \frac{m}{n} \quad \text{(g/mol)}'
    description: "Bridge between grams (lab) and moles (equations)."
    tags: [definition, moles]
    derives_from: []

  - id: avogadro
    name: "Avogadro's number"
    topic: "Stoichiometry"
    latex: 'N = n \cdot N_A, \quad N_A = 6.022 \times 10^{23}'
    description: "Particles per mole. The chemist's dozen."
    tags: [constant]
    derives_from: []

  - id: percent-comp
    name: "Percent composition"
    topic: "Stoichiometry"
    latex: '\%X = \frac{\text{mass of } X}{\text{total mass}} \times 100\%'
    description: "Mass share of each element in a compound."
    tags: [composition]
    derives_from: [molar-mass]

  - id: empirical
    name: "Empirical formula"
    topic: "Stoichiometry"
    latex: '\text{percent} \to \text{grams} \to \text{moles} \to \text{divide by smallest} \to \text{whole-number ratio}'
    description: "Simplest ratio procedure. Multiply to clear fractions at the end."
    tags: [method]
    derives_from: [percent-comp, avogadro]

  - id: molarity
    name: "Molarity"
    topic: "Solutions"
    latex: 'M = \frac{n_{\text{solute}}}{L_{\text{solution}}}'
    description: "Moles per liter of solution, not solvent."
    tags: [definition, concentration]
    derives_from: [molar-mass]

  - id: dilution
    name: "Dilution"
    topic: "Solutions"
    latex: 'M_1 V_1 = M_2 V_2'
    description: "Moles of solute are conserved when adding solvent."
    tags: [concentration]
    derives_from: [molarity]

  - id: boyle
    name: "Boyle's law"
    topic: "Gases"
    latex: 'P_1 V_1 = P_2 V_2 \quad \text{(constant } T, n \text{)}'
    description: "Squeeze a gas, pressure rises. Inverse relationship."
    tags: [gas-law]
    derives_from: []

  - id: charles
    name: "Charles's law"
    topic: "Gases"
    latex: '\frac{V_1}{T_1} = \frac{V_2}{T_2} \quad \text{(constant } P, n \text{; } T \text{ in kelvin)}'
    description: "Heat a gas, it expands. Temperature must be absolute."
    tags: [gas-law]
    derives_from: []

  - id: gay-lussac
    name: "Gay-Lussac's law"
    topic: "Gases"
    latex: '\frac{P_1}{T_1} = \frac{P_2}{T_2} \quad \text{(constant } V, n \text{; } T \text{ in kelvin)}'
    description: "Heat a sealed container, pressure rises."
    tags: [gas-law]
    derives_from: []

  - id: combined-gas
    name: "Combined gas law"
    topic: "Gases"
    latex: '\frac{P_1 V_1}{T_1} = \frac{P_2 V_2}{T_2}'
    description: "All three simple gas laws in one. Hold any variable constant to recover each."
    tags: [gas-law]
    derives_from: [boyle, charles, gay-lussac]

  - id: ideal-gas
    name: "Ideal gas law"
    topic: "Gases"
    latex: 'PV = nRT, \quad R = 0.08206 \, \frac{\text{L} \cdot \text{atm}}{\text{mol} \cdot \text{K}}'
    description: "Adds moles to the combined law. Match R units to your P and V units."
    tags: [gas-law]
    derives_from: [combined-gas, avogadro]

  - id: dalton
    name: "Dalton's law of partial pressures"
    topic: "Gases"
    latex: 'P_{\text{total}} = \sum P_i'
    description: "Each gas contributes independently, as if alone."
    tags: [gas-law]
    derives_from: [ideal-gas]

  - id: gas-density
    name: "Gas density and molar mass"
    topic: "Gases"
    latex: 'd = \frac{PM}{RT}, \quad M = \frac{dRT}{P}'
    description: "Weigh a gas to identify it: density reveals molar mass."
    tags: [gas-law]
    derives_from: [ideal-gas, molar-mass]

  - id: q-temp
    name: "Heat and temperature change"
    topic: "Thermochemistry"
    latex: 'q = mc\Delta T'
    description: "Heat equals mass times specific heat times temperature change. Sign follows the system."
    tags: [heat]
    derives_from: []

  - id: q-phase
    name: "Heat of phase change"
    topic: "Thermochemistry"
    latex: 'q = n \Delta H_{\text{phase}}'
    description: "Melting, vaporizing: heat with no temperature change."
    tags: [heat]
    derives_from: [avogadro]

  - id: hess
    name: "Hess's law"
    topic: "Thermochemistry"
    latex: '\Delta H_{\text{rxn}} = \sum \Delta H_{\text{steps}}'
    description: "Enthalpy is a state function: any path between reactants and products gives the same total."
    tags: [enthalpy]
    derives_from: []

  - id: hf
    name: "Standard enthalpies of formation"
    topic: "Thermochemistry"
    latex: '\Delta H^\circ_{\text{rxn}} = \sum n \Delta H^\circ_f(\text{products}) - \sum n \Delta H^\circ_f(\text{reactants})'
    description: "Build the reaction from elements: products minus reactants."
    tags: [enthalpy]
    derives_from: [hess]

  - id: wavelength
    name: "Wave equation"
    topic: "Atomic Structure"
    latex: 'c = \lambda \nu, \quad c = 3.00 \times 10^8 \, \text{m/s}'
    description: "Longer wavelength means lower frequency."
    tags: [light]
    derives_from: []

  - id: photon
    name: "Photon energy"
    topic: "Atomic Structure"
    latex: 'E = h\nu = \frac{hc}{\lambda}, \quad h = 6.626 \times 10^{-34} \, \text{J} \cdot \text{s}'
    description: "Light comes in packets. Bluer light carries more energy per photon."
    tags: [light, quantum]
    derives_from: [wavelength]

  - id: bohr
    name: "Bohr energy levels"
    topic: "Atomic Structure"
    latex: 'E_n = -R_H \left(\frac{1}{n^2}\right), \quad \Delta E = R_H \left(\frac{1}{n_f^2} - \frac{1}{n_i^2}\right)'
    description: "Hydrogen electron energies. Negative because bound; photon emitted when dropping levels."
    tags: [quantum, hydrogen]
    derives_from: [photon]

  - id: quantum-numbers
    name: "Quantum numbers"
    topic: "Atomic Structure"
    latex: 'n \ge 1, \quad 0 \le l \le n-1, \quad -l \le m_l \le l, \quad m_s = \pm \tfrac{1}{2}'
    description: "Address of an electron: shell, subshell, orbital, spin. Pauli: no two electrons share all four."
    tags: [quantum]
    derives_from: [bohr]
