course: "AMS 261"
title: "Calculus III"
description: "Partial derivatives, multiple integrals, and vector calculus: gradient, divergence, curl, line and surface integrals, Green, Stokes, and the divergence theorem."

formulas:
  - id: partial-def
    name: "Partial derivative (definition)"
    topic: "Partial Derivatives"
    latex: 'f_x(x,y) = \lim_{h \to 0} \frac{f(x+h,y)-f(x,y)}{h}, \quad f_y(x,y) = \lim_{h \to 0} \frac{f(x,y+h)-f(x,y)}{h}'
    description: "Rate of change holding all other variables fixed. Clairaut's theorem: f_{xy} = f_{yx} for continuous second partials."
    tags: [definition, limit]
    derives_from: []

  - id: gradient
    name: "Gradient vector"
    topic: "Partial Derivatives"
    latex: '\nabla f = \langle f_x, f_y, f_z \rangle'
    description: "Points in the direction of steepest increase; magnitude is the steepest slope. Zero gradient marks critical points."
    tags: [vector]
    derives_from: [partial-def]

  - id: chain-rule
    name: "Multivariable chain rule"
    topic: "Partial Derivatives"
    latex: '\frac{dz}{dt} = f_x \frac{dx}{dt} + f_y \frac{dy}{dt} \quad \text{for } z = f(x(t), y(t))'
    description: "Differentiate a composition by summing over every path the variable takes."
    tags: [differentiation]
    derives_from: [partial-def]

  - id: directional
    name: "Directional derivative"
    topic: "Partial Derivatives"
    latex: 'D_{\mathbf{u}} f = \nabla f \cdot \mathbf{u}, \quad \lVert \mathbf{u} \rVert = 1'
    description: "Slope of f in direction u. Maximum value is |grad f|, attained when u points along the gradient."
    tags: [vector]
    derives_from: [gradient]

  - id: tangent-plane
    name: "Tangent plane"
    topic: "Partial Derivatives"
    latex: 'z = f(a,b) + f_x(a,b)(x-a) + f_y(a,b)(y-b)'
    description: "Linearization of a surface at a point; the 2D analog of the tangent line."
    tags: [approximation]
    derives_from: [partial-def]

  - id: second-deriv-test
    name: "Second derivative test"
    topic: "Optimization"
    latex: 'D = f_{xx} f_{yy} - (f_{xy})^2; \; D > 0, f_{xx} > 0 \Rightarrow \text{min}; \; D > 0, f_{xx} < 0 \Rightarrow \text{max}; \; D < 0 \Rightarrow \text{saddle}'
    description: "Classifies critical points (where f_x = f_y = 0) using the Hessian determinant."
    tags: [optimization, critical-point]
    derives_from: [partial-def]

  - id: lagrange
    name: "Lagrange multipliers"
    topic: "Optimization"
    latex: '\nabla f = \lambda \nabla g \quad \text{subject to } g(x,y,z) = c'
    description: "At a constrained optimum, the gradients of f and the constraint g are parallel."
    tags: [optimization]
    derives_from: [gradient]

  - id: double-rect
    name: "Double integral over a rectangle"
    topic: "Multiple Integrals"
    latex: '\iint_R f(x,y) \, dA = \int_a^b \int_c^d f(x,y) \, dy \, dx'
    description: "Volume under a surface; computed as an iterated integral (Fubini)."
    tags: [integration]
    derives_from: []

  - id: polar
    name: "Polar change of variables"
    topic: "Multiple Integrals"
    latex: '\iint_D f(x,y) \, dA = \iint f(r\cos\theta, r\sin\theta) \, r \, dr \, d\theta'
    description: "The extra r is the Jacobian. Use for circular symmetry."
    tags: [integration, coordinates]
    derives_from: [double-rect]

  - id: triple
    name: "Triple integral"
    topic: "Multiple Integrals"
    latex: '\iiint_E f(x,y,z) \, dV'
    description: "Mass/volume of a 3D region; iterated exactly like a double integral with one more layer."
    tags: [integration]
    derives_from: [double-rect]

  - id: cylindrical
    name: "Cylindrical coordinates"
    topic: "Multiple Integrals"
    latex: 'dV = r \, dz \, dr \, d\theta, \quad x = r\cos\theta, \; y = r\sin\theta'
    description: "Polar in the xy-plane plus height. Natural for cylinders and cones."
    tags: [integration, coordinates]
    derives_from: [triple, polar]

  - id: spherical
    name: "Spherical coordinates"
    topic: "Multiple Integrals"
    latex: 'dV = \rho^2 \sin\phi \, d\rho \, d\phi \, d\theta, \quad \phi \text{ from positive } z\text{-axis}'
    description: "Natural for spheres and balls. Watch which angle is phi: from the z-axis here."
    tags: [integration, coordinates]
    derives_from: [triple]

  - id: line-scalar
    name: "Line integral of a scalar function"
    topic: "Vector Calculus"
    latex: '\int_C f \, ds = \int_a^b f(\mathbf{r}(t)) \, \lVert \mathbf{r}''(t) \rVert \, dt'
    description: "Accumulates f along a curve; ds weights by arc length."
    tags: [integration, curve]
    derives_from: []

  - id: line-vector
    name: "Line integral of a vector field (work)"
    topic: "Vector Calculus"
    latex: '\int_C \mathbf{F} \cdot d\mathbf{r} = \int_a^b \mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}''(t) \, dt'
    description: "Work done by F along C. Sign flips if the curve orientation reverses."
    tags: [integration, work]
    derives_from: [line-scalar]

  - id: ftli
    name: "Fundamental theorem of line integrals"
    topic: "Vector Calculus"
    latex: '\int_C \nabla f \cdot d\mathbf{r} = f(\mathbf{r}(b)) - f(\mathbf{r}(a))'
    description: "Line integrals of gradient fields are path independent; a field is conservative iff it is a gradient (on simply connected domains)."
    tags: [theorem, conservative]
    derives_from: [line-vector, gradient, chain-rule]

  - id: green
    name: "Green's theorem"
    topic: "Vector Calculus"
    latex: '\oint_C P \, dx + Q \, dy = \iint_D \left( \frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y} \right) dA'
    description: "Circulation around a closed curve equals the double integral of (Q_x - P_y) over the region. Positive (counterclockwise) orientation."
    tags: [theorem]
    derives_from: [line-vector, double-rect]

  - id: curl
    name: "Curl"
    topic: "Vector Calculus"
    latex: '\nabla \times \mathbf{F} = \langle R_y - Q_z, \; P_z - R_x, \; Q_x - P_y \rangle'
    description: "Measures local rotation of a field. Zero curl (on simply connected domains) means conservative."
    tags: [vector]
    derives_from: [partial-def]

  - id: divergence
    name: "Divergence"
    topic: "Vector Calculus"
    latex: '\nabla \cdot \mathbf{F} = P_x + Q_y + R_z'
    description: "Measures local outflow (source/sink strength) of a field."
    tags: [vector]
    derives_from: [partial-def]

  - id: flux
    name: "Flux surface integral"
    topic: "Vector Calculus"
    latex: '\iint_S \mathbf{F} \cdot d\mathbf{S} = \iint_D \mathbf{F} \cdot (\mathbf{r}_u \times \mathbf{r}_v) \, dA'
    description: "Net flow of F through a surface. Orientation (choice of normal) fixes the sign."
    tags: [integration, surface]
    derives_from: [double-rect]

  - id: stokes
    name: "Stokes' theorem"
    topic: "Vector Calculus"
    latex: '\oint_C \mathbf{F} \cdot d\mathbf{r} = \iint_S (\nabla \times \mathbf{F}) \cdot d\mathbf{S}'
    description: "Circulation around the boundary curve equals flux of curl through the surface. Boundary orientation follows the right-hand rule."
    tags: [theorem]
    derives_from: [line-vector, curl, flux]

  - id: div-theorem
    name: "Divergence theorem"
    topic: "Vector Calculus"
    latex: '\iint_S \mathbf{F} \cdot d\mathbf{S} = \iiint_E (\nabla \cdot \mathbf{F}) \, dV'
    description: "Outward flux through a closed surface equals the triple integral of divergence inside."
    tags: [theorem]
    derives_from: [flux, divergence, triple]
